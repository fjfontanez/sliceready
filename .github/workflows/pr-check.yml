name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]

# Read-only: these jobs inspect the PR body and issue/PR labels. Nothing here
# writes, and no secrets beyond the default GITHUB_TOKEN are used.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check-pr-size:
    name: Check PR Cognitive Load
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR stays within review budget
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const limit = 400;
            const pr = context.payload.pull_request;
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const total = additions + deletions;
            const labels = (pr.labels || []).map(label => label.name);
            const hasException = labels.includes('size:exception');

            console.log(`PR size: +${additions} / -${deletions} = ${total} changed lines`);
            console.log(`Labels: ${labels.join(', ') || '(none)'}`);

            if (total <= limit) {
              console.log(`✅ PR is within the ${limit}-line cognitive review budget.`);
              return;
            }

            const message =
              `PR changes ${total} lines (+${additions}/-${deletions}), exceeding the ${limit}-line cognitive review budget.\n\n` +
              'Why this exists: reviews should stay small enough to complete in ~60 minutes without reviewer fatigue.\n' +
              'Please split this work into chained or stacked PRs, or ask a maintainer for the size:exception label when the large diff is unavoidable.';

            if (hasException) {
              core.warning(`⚠️ ${message}`);
              console.log('✅ size:exception label present; allowing oversized PR with warning.');
              return;
            }

            core.setFailed(`❌ ${message}`);

  # Dependabot cannot link an approved issue, and no dependabot.yml gives its
  # PRs a type:* label, so the three issue-first checks skip its PRs. A skipped
  # job reports success, which keeps those required checks green.
  #
  # The exemption holds only while every commit is authored by Dependabot: a
  # human commit pushed onto its branch brings the checks back. Dependent jobs
  # use always() so a failure here runs the checks instead of skipping them.
  dependabot-exemption:
    name: Detect Dependabot-only PR
    runs-on: ubuntu-latest
    outputs:
      exempt: ${{ steps.detect.outputs.exempt }}
    steps:
      - name: Check PR author and commit authors
        id: detect
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const bot = 'dependabot[bot]';
            const pr = context.payload.pull_request;

            if (pr.user.login !== bot) {
              console.log(`PR author is ${pr.user.login}; issue-first checks apply.`);
              core.setOutput('exempt', 'false');
              return;
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const foreign = commits.filter(c => c.author?.login !== bot);

            if (foreign.length > 0) {
              const list = foreign
                .map(c => `${c.sha.slice(0, 7)} by ${c.author?.login ?? c.commit.author.email}`)
                .join(', ');
              console.log(`Non-Dependabot commits found (${list}); issue-first checks apply.`);
              core.setOutput('exempt', 'false');
              return;
            }

            console.log(`All ${commits.length} commit(s) are by ${bot}; skipping issue-first checks.`);
            core.setOutput('exempt', 'true');

  check-issue-reference:
    name: Check Issue Reference
    needs: dependabot-exemption
    if: always() && needs.dependabot-exemption.outputs.exempt != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR body references an issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const pattern = /(?:closes|fixes|resolves)\s+#(\d+)/gi;
            const matches = [...body.matchAll(pattern)];

            if (matches.length === 0) {
              core.setFailed(
                '❌ PR body must reference a linked issue using one of:\n' +
                '  - Closes #<number>\n' +
                '  - Fixes #<number>\n' +
                '  - Resolves #<number>\n\n' +
                'Every PR must be linked to an approved issue. See CONTRIBUTING.md.'
              );
            } else {
              const numbers = matches.map(m => `#${m[1]}`).join(', ');
              console.log(`✅ Found issue reference(s): ${numbers}`);
            }

  check-issue-approved:
    name: Check Issue Has status:approved
    needs: [dependabot-exemption, check-issue-reference]
    if: >-
      always()
      && needs.dependabot-exemption.outputs.exempt != 'true'
      && needs.check-issue-reference.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify linked issue(s) have status:approved label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const pattern = /(?:closes|fixes|resolves)\s+#(\d+)/gi;
            const matches = [...body.matchAll(pattern)];

            if (matches.length === 0) {
              core.setFailed('❌ Could not find issue reference in PR body.');
              return;
            }

            const issueNumbers = matches.map(m => parseInt(m[1], 10));
            const failures = [];

            for (const issueNumber of issueNumbers) {
              console.log(`Checking issue #${issueNumber} for status:approved label...`);

              let issue;
              try {
                const response = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                issue = response.data;
              } catch (err) {
                failures.push(`❌ Could not fetch issue #${issueNumber}: ${err.message}`);
                continue;
              }

              const labels = issue.labels.map(l => l.name);
              console.log(`Labels on issue #${issueNumber}: ${labels.join(', ') || '(none)'}`);

              if (!labels.includes('status:approved')) {
                failures.push(
                  `❌ Issue #${issueNumber} does not have the "status:approved" label.\n` +
                  '   Issues must be approved by a maintainer before work begins.\n' +
                  '   Please comment on the issue and wait for it to be labelled status:approved.'
                );
              } else {
                console.log(`✅ Issue #${issueNumber} has status:approved.`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(failures.join('\n\n'));
            }

  check-type-label:
    name: Check PR Has type:* Label
    needs: dependabot-exemption
    if: always() && needs.dependabot-exemption.outputs.exempt != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR has exactly one type:* label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const labels = pr.labels.map(l => l.name);
            const typeLabels = labels.filter(l => l.startsWith('type:'));

            console.log(`All PR labels: ${labels.join(', ') || '(none)'}`);
            console.log(`type:* labels found: ${typeLabels.join(', ') || '(none)'}`);

            if (typeLabels.length === 0) {
              core.setFailed(
                '❌ PR must have exactly one type:* label.\n\n' +
                'Valid labels:\n' +
                '  type:bug, type:feature, type:refactor,\n' +
                '  type:docs, type:chore, type:breaking-change\n\n' +
                'Ask a maintainer to add the appropriate label.'
              );
            } else if (typeLabels.length > 1) {
              core.setFailed(
                `❌ PR has ${typeLabels.length} type:* labels: ${typeLabels.join(', ')}\n` +
                'A PR must have exactly ONE type:* label. Please remove the extra one(s).'
              );
            } else {
              console.log(`✅ PR has type label: ${typeLabels[0]}`);
            }
